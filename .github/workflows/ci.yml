name: CI

on:
  push:
  pull_request:

jobs:
  python-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/python-network-scanner
          - projects/linux-log-analyzer
          - projects/file-integrity-monitor
          - projects/secure-login-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f "${{ matrix.project }}/requirements.txt" ]; then
            pip install -r "${{ matrix.project }}/requirements.txt"
          fi

      - name: Syntax check
        run: python -m compileall "${{ matrix.project }}"

      - name: Run tests
        run: pytest -q "${{ matrix.project }}/tests"
